<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Planeta Reggae Space</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('https://xatimg.com/image/MyW6v3dGnsaQ.png') no-repeat center center fixed;
  background-size: cover;
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

/* AVATAR */
.avatar {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 80px auto 10px;
  background: linear-gradient(45deg, cyan, blue, purple);
  padding: 4px;
  animation: glow 4s infinite linear;
}

.avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

@keyframes glow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

/* NOME EM IMAGEM */
.nome-img {
  width: 220px;
  margin: 10px auto 5px;
  display: block;
}

/* LOGO */
.logo {
  width: 260px;
  margin: 10px auto 20px;
}

/* CARD */
.card {
  background: rgba(0,0,0,0.6);
  border-radius: 12px;
  padding: 15px;
  margin: 15px auto;
  max-width: 500px;
}

/* PLAYER */
#player {
  width: 100%;
  height: 260px;
  background: url('https://xatimg.com/image/MyW6v3dGnsaQ.png') center/cover;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

/* ESPECTRO */
.spectrum {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 110px;
  width: 100%;
  gap: 2px;
  margin-top: 35px;
}

.bar {
  width: 3px;
  background: linear-gradient(cyan, purple);
  animation: bounce 1s infinite ease-in-out;
}

.bar:nth-child(3n){animation-delay:.2s;}
.bar:nth-child(4n){animation-delay:.4s;}
.bar:nth-child(5n){animation-delay:.6s;}

@keyframes bounce {
  0%,100% { height: 10px; }
  50% { height: 100px; }
}

/* CONTROLES */
.controls {
  position: absolute;
  bottom: 15px;
  width: 100%;
}

/* BOTÕES */
button {
  background: linear-gradient(45deg, cyan, purple);
  border: none;
  padding: 10px 16px;
  color: #fff;
  border-radius: 6px;
  margin: 10px;
  cursor: pointer;
}

/* VOLUME */
input[type="range"] {
  width: 130px;
  margin-top: 20px;
}

/* LINKS */
.link-btn {
  display: inline-block;
  background: linear-gradient(45deg, cyan, purple);
  padding: 10px 16px;
  margin: 6px;
  color: white;
  border-radius: 6px;
  text-decoration: none;
}

/* FRASE */
.frase-final {
  font-size: 18px;
  font-style: italic;
  background: linear-gradient(90deg, cyan, purple, cyan);
  background-size: 200%;
  -webkit-background-clip: text;
  color: transparent;
  animation: shine 4s linear infinite;
}

@keyframes shine {
  0% { background-position: 0%; }
  100% { background-position: 200%; }
}
</style>
</head>

<body>

<div class="container">

  <!-- AVATAR -->
  <div class="avatar">
    <img src="https://xatimg.com/image/rQ4RqinIaDXx.gif">
  </div>

  <!-- IMAGEM NO LUGAR DO NOME + ID -->
  <img src="https://xatimg.com/image/DoylTXlmazAz.png" class="nome-img">

  <!-- LOGO -->
  <img src="https://xatimg.com/image/MVORqy3CCDrW.png" class="logo">

  <!-- PLAYER -->
  <div class="card">
    <div id="player">

      <!-- ESPECTRO -->
      <div class="spectrum">
        <!-- 50 barras -->
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>

      <!-- CONTROLES -->
      <div class="controls">
        <button onclick="play()">Play</button>
        <button onclick="pause()">Pause</button>
        <button onclick="mute()">Mute</button>
        <br>
        <input type="range" min="0" max="1" step="0.01" value="1" oninput="volume(this.value)">
      </div>

      <audio id="audio" src="https://servidor13.brlogic.com:7020/live"></audio>

    </div>
  </div>

  <!-- LINKS -->
  <div class="card">
    <a href="https://xat.com/planetareggae" target="_blank" class="link-btn">Chat</a>
    <a href="https://xat.com/ajuda" target="_blank" class="link-btn">Ajuda</a>
    <a href="https://xat.com/loja" target="_blank" class="link-btn">Loja</a>
    <a href="https://instagram.com/planetareggaeofc" target="_blank" class="link-btn">Instagram</a>
  </div>

  <!-- FRASE -->
  <div class="card">
    <div class="frase-final">
      "Não vim pra me curvar, eu vim para conquistar"
    </div>
  </div>

</div>

<script>
var audio = document.getElementById("audio");

function play() { audio.play(); }
function pause() { audio.pause(); }
function mute() { audio.muted = !audio.muted; }
function volume(v) { audio.volume = v; }
</script>

</body>
</html>
